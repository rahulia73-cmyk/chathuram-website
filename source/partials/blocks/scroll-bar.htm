<!-- scroll bar (laptops and phones): the pawn hops along the squares as the page scrolls, and promotes at the end -->
<div class="scroll-bar" data-scroll-rail data-axis="x" aria-hidden="true">
  <div class="container position-relative">
    <div class="scroll-rail-track">
      <span class="scroll-rail-tile"></span>
      <span class="scroll-rail-tile"></span>
      <span class="scroll-rail-tile"></span>
      <span class="scroll-rail-tile"></span>
      <span class="scroll-rail-tile"></span>
      <span class="scroll-rail-tile"></span>
      <span class="scroll-rail-tile"></span>
      <span class="scroll-rail-tile"></span>
    </div>
    <div class="scroll-rail-piece">
      <div class="scroll-rail-spin">
        <img class="is-current" data-piece="pawn" src="images/brand/pieces/pawn.svg" alt="">
        <img data-piece="queen" src="images/brand/pieces/queen.svg" alt="">
      </div>
    </div>
  </div>
</div>
