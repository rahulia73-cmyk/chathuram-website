<!-- scroll rail (wide screens): as the page scrolls, the square under the pawn
     vanishes in a puff of cloud and the pawn drops to the next one -->
<div class="scroll-rail" data-scroll-rail aria-hidden="true">
  <div class="scroll-rail-track">
    <span class="scroll-rail-tile"></span>
    <span class="scroll-rail-tile"></span>
    <span class="scroll-rail-tile"></span>
    <span class="scroll-rail-tile"></span>
    <span class="scroll-rail-tile"></span>
    <span class="scroll-rail-tile"></span>
    <span class="scroll-rail-tile"></span>
    <span class="scroll-rail-tile"></span>
  </div>
  <div class="scroll-rail-piece">
    <div class="scroll-rail-spin">
      <img class="is-current" data-piece="pawn" src="images/brand/pieces/pawn.svg?v=@@version" alt="">
      <img data-piece="queen" src="images/brand/pieces/queen.svg?v=@@version" alt="">
    </div>
  </div>
</div>
